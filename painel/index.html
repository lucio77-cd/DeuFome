<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#e8451e"><title>Painel do restaurante — Deu Fome</title><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/painel.css"></head>
<body><header class="topo">Deu Fome <span class="topo-sub">· Painel do restaurante</span></header><main class="container">
<section id="loginCard" class="card"><h1>Entrar no restaurante</h1><p class="texto-suave">Use o e-mail e a senha cadastrados pelo responsável.</p><form id="loginForm"><div class="campo"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="campo"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required></div><button class="btn btn-bloco" type="submit">Entrar</button></form><p id="loginErro" class="mensagem erro oculto"></p></section>
<section id="painelArea" class="oculto"><div class="linha-titulo"><div><h1 id="tituloRestaurante">Meu restaurante</h1><p class="texto-suave">Gerencie as informações e o cardápio.</p></div><button id="sair" class="btn btn-secundario">Sair</button></div>
<section class="card"><h2>Configurações</h2><form id="configForm"><div class="campo"><label for="nomeRestaurante">Nome público</label><input id="nomeRestaurante" maxlength="80" required></div><div class="campo"><label for="horario">Horário de funcionamento</label><input id="horario" maxlength="120" placeholder="Ex.: Seg–Sáb, 18h às 23h"></div><div class="campo"><label for="taxa">Taxa de entrega (R$)</label><input id="taxa" inputmode="decimal" placeholder="0,00"></div><label class="check-linha"><input id="aberto" type="checkbox"> Restaurante aberto para pedidos</label><button class="btn btn-bloco" type="submit">Salvar configurações</button></form><p id="configMensagem" class="mensagem oculto"></p></section>
<section class="card"><h2>Categorias</h2><form id="categoriaForm" class="form-inline"><div class="campo campo-flex"><label for="categoriaNome">Nova categoria</label><input id="categoriaNome" maxlength="50" placeholder="Ex.: Pizzas" required></div><button class="btn" type="submit">Adicionar</button></form><div id="listaCategorias" class="lista-registros"><p class="texto-suave">Carregando...</p></div></section>
<section class="card"><h2>Produtos</h2><form id="produtoForm"><input id="produtoId" type="hidden"><div class="campo"><label for="produtoNome">Nome do produto</label><input id="produtoNome" maxlength="90" required></div><div class="campo"><label for="produtoDescricao">Descrição (opcional)</label><textarea id="produtoDescricao" rows="2" maxlength="240"></textarea></div><div class="campo"><label for="produtoCategoria">Categoria</label><select id="produtoCategoria" required><option value="">Cadastre uma categoria primeiro</option></select></div><div class="campo"><label for="produtoPreco">Preço (R$)</label><input id="produtoPreco" inputmode="decimal" placeholder="0,00" required></div><label class="check-linha"><input id="produtoDisponivel" type="checkbox" checked> Disponível para venda</label><div class="botoes-form"><button id="salvarProduto" class="btn" type="submit">Salvar produto</button><button id="cancelarEdicao" class="btn btn-secundario oculto" type="button">Cancelar edição</button></div></form><p id="produtoMensagem" class="mensagem oculto"></p><div id="listaProdutos" class="lista-registros"><p class="texto-suave">Carregando...</p></div></section></section><a class="link-voltar" href="../">← Página inicial</a></main><script type="module" src="../js/painel.js"></script></body></html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8451e"><title>Painel do restaurante — Deu Fome</title>
  <link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/painel.css">
</head>
<body>
<header class="topo">Deu Fome <span class="topo-secundario">/ Restaurante</span></header>
<main class="container painel-container">
  <section id="loginCard" class="card">
    <h1>Entrar no restaurante</h1><p class="texto-suave">Use a conta que o Mestre vinculou ao seu estabelecimento.</p>
    <form id="loginForm">
      <div class="campo"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="campo"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-bloco" type="submit">Entrar</button>
    </form><p id="loginErro" class="mensagem erro" aria-live="polite"></p>
  </section>
  <div id="app" class="oculto">
    <section class="painel-cabecalho"><div><p class="sobretitulo">ÁREA DO RESTAURANTE</p><h1 id="tituloRestaurante">Seu estabelecimento</h1><p class="texto-suave">Gerencie informações e cardápio.</p></div><button id="sair" class="btn btn-secundario">Sair</button></section>
    <section id="seletorArea" class="card oculto"><label for="seletorRestaurante">Escolha o restaurante</label><select id="seletorRestaurante"></select></section>
    <section class="card">
      <h2>Configurações</h2>
      <form id="configForm">
        <div class="campo"><label for="nomeRestaurante">Nome</label><input id="nomeRestaurante" maxlength="80" required></div>
        <div class="grade-dois">
          <div class="campo"><label for="taxa">Taxa de entrega (R$)</label><input id="taxa" inputmode="decimal" placeholder="0,00" required></div>
          <div class="campo"><label for="abertura">Abre às</label><input id="abertura" type="time" required></div>
          <div class="campo"><label for="fechamento">Fecha às</label><input id="fechamento" type="time" required></div>
        </div>
        <label class="check-linha"><input id="aberto" type="checkbox"> Restaurante aberto para pedidos</label>
        <button class="btn btn-bloco" type="submit">Salvar configurações</button>
      </form>
    </section>
    <section class="card">
      <h2>Categorias do cardápio</h2>
      <form id="categoriaForm" class="form-linha"><div class="campo"><label for="categoriaNome">Nova categoria</label><input id="categoriaNome" maxlength="45" required placeholder="Ex.: Lanches"></div><button class="btn" type="submit">Adicionar</button></form>
      <div id="listaCategorias"></div>
    </section>
    <section class="card">
      <h2>Produtos</h2>
      <form id="produtoForm">
        <input id="produtoId" type="hidden">
        <div class="campo"><label for="produtoNome">Nome do produto</label><input id="produtoNome" maxlength="80" required placeholder="Ex.: X-salada"></div>
        <div class="campo"><label for="produtoDescricao">Descrição (opcional)</label><textarea id="produtoDescricao" rows="2" maxlength="240" placeholder="Ingredientes e detalhes"></textarea></div>
        <div class="grade-dois">
          <div class="campo"><label for="produtoPreco">Preço (R$)</label><input id="produtoPreco" inputmode="decimal" required placeholder="0,00"></div>
          <div class="campo"><label for="produtoCategoria">Categoria</label><select id="produtoCategoria" required></select></div>
        </div>
        <label class="check-linha"><input id="produtoDisponivel" type="checkbox" checked> Disponível</label>
        <div class="botoes-form"><button class="btn" type="submit" id="salvarProduto">Salvar produto</button><button class="btn btn-secundario oculto" type="button" id="cancelarEdicao">Cancelar edição</button></div>
      </form>
      <div id="listaProdutos"></div>
    </section>
  </div>
  <a class="link-voltar" href="../">Voltar ao início</a>
</main>
<script type="module" src="./painel.js"></script>
</body></html>

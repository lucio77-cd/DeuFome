<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#e8451e"><link rel="manifest" href="/manifest-cliente.webmanifest"><link rel="icon" href="/icone.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icones/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Deu Fome"><title>Meus pedidos — Deu Fome</title>
  <link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/cliente.css"><link rel="stylesheet" href="/css/pedidos.css">
</head>
<body>
<header class="topo"><a class="topo-link" href="/">🍔 Deu Fome</a></header>
<main class="container cliente-container">
  <a class="link-voltar" href="/">← Início</a>
  <h1>Meus pedidos</h1>
  <p id="carregando" class="texto-suave centro">Carregando...</p>

  <section id="login" class="card centro oculto">
    <p>Entre com a sua conta Google para ver os seus pedidos.</p>
    <p id="loginMsg" class="mensagem erro" aria-live="polite"></p>
    <button id="entrarGoogle" class="btn btn-bloco" type="button">Entrar com o Google</button>
  </section>

  <div id="conta" class="oculto">
    <p class="texto-suave texto-pequeno">Você entrou como <strong id="nomeGoogle"></strong> · <button id="sairConta" class="link-botao" type="button">Sair</button></p>
    <div id="lista"></div>
  </div>
</main>
<footer class="rodape texto-suave">
  <a href="/privacidade">Privacidade</a>
</footer>
<script type="module" src="/js/meus-pedidos.js"></script>
</body></html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F56A12"><link rel="manifest" href="/manifest-cliente.webmanifest"><link rel="icon" href="/icone.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icones/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Deu Fome"><title>Meus pedidos — Deu Fome</title>
  <link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/cliente.css"><link rel="stylesheet" href="/css/pedidos.css">
</head>
<body>
<header class="topo"><a class="topo-link" href="/" aria-label="Deu Fome, início"><img class="logo" src="/marca/logo.svg" alt="Deu Fome" width="75" height="54"></a></header>
<main class="container cliente-container">
  <a class="link-voltar" href="/">← Início</a>
  <h1>Meus pedidos</h1>
  <p id="carregando" class="texto-suave centro">Carregando...</p>

  <section id="login" class="card centro oculto">
    <p>Entre com a sua conta Google para ver os seus pedidos.</p>
    <p id="loginMsg" class="mensagem erro" aria-live="polite"></p>
    <button id="entrarGoogle" class="btn btn-google btn-bloco" type="button"><svg class="icone-google" viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 2.9-2.2 5.3-4.7 7l7.3 5.7c4.3-4 6.7-9.8 6.7-17.2z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.3 0 11.6-2.1 15.500-5.700l-7.300-5.700c-2 1.400-4.700 2.300-8.200 2.300-6.300 0-11.600-4.100-13.500-9.800l-7.900 6.1C6.500 42.600 14.600 48 24 48z"/></svg><span>Entrar com o Google</span></button>
  </section>

  <div id="conta" class="oculto">
    <p class="texto-suave texto-pequeno">Você entrou como <strong id="nomeGoogle"></strong> · <button id="sairConta" class="link-botao" type="button">Sair</button></p>
    <div id="lista"></div>
  </div>
</main>
<footer class="rodape texto-suave">
  <a href="/privacidade">Privacidade</a>
</footer>
<script type="module" src="/js/meus-pedidos.js"></script>
</body></html>

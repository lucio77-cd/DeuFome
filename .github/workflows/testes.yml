# Roda sozinho no GitHub a cada envio para o main (sem instalar nada no seu computador).
# Aba "Actions" do repositório mostra verde (passou) ou vermelho (falhou).
name: Testes
on:
  push:
    branches: [main]
  pull_request:
jobs:
  funcoes:
    name: Funções e simulado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm test
  regras:
    name: Regras do Firestore (emulador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: cd tests && npm install --no-audit --no-fund
      - run: cd tests && npm test
